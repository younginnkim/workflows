                display: { text: { i18n_key: "sn_home_0037", i18n_key_source: from_pdf, fallback: "Connect" }, default_focus: true }

          - trigger: on_select
            # 순서 1: 사운드 아웃 설정값 확인 및 보정 (선행 조건)
            conditions:
              - when:
                  natural: "단, 연결 시 사운드 아웃 설정값이 '블루투스 기기' 또는 '블루투스 + 기기 스피커'로 설정되어 있는 경우"
                  impl:
                    type: luna_call
                    decision_ref: soundout-get
                    service: "com.webos.service.audio"
                    method: "getSoundOutput"
                    condition_expr: "['bt_soundbar','lgSoundSync','tv_external_speaker'].includes(response.soundOutput)"
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                action:
                  natural: "'기기 스피커'로 변경함 (세부 내용은 Settings_Sound 시나리오 참고)"
                  impl:
                    type: luna_call
                    decision_ref: soundout-set
                    service: "com.webos.service.audio"
                    method: "setSoundOutput"
                    params: { soundOutput: "tv_speaker" }
                  sequence: 1

              # 순서 2: 최근 기기 연결 시도
              - when:
                  natural: "연결 이력이 있을 경우 가장 최근에 연결한 기기에 연결 시도"
                  impl:
                    type: luna_call
                    decision_ref: bt-a2dp-connect
                    service: "com.webos.service.bluetooth2"
                    method: "a2dp/connect"
                    params: { address: "{recent_device.address}" }
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                action:
                  natural: "가장 최근에 연결한 기기에 연결 시도"
                  sequence: 2

              # 순서 3: Sound Share 앱 Play 씬 이동
              - when:
                  natural: "Sound Share 앱 실행 후, Play 씬으로 이동"
                  impl:
                    type: luna_call
                    decision_ref: soundshare-stream-out
                    service: "com.webos.service.applicationmanager"
                    method: "launch"
                    params:
                      id: "{UNRESOLVED:soundshare_app_id}"
                      params: { scene: "play" }
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                action:
                  natural: "Sound Share 앱 실행 후, Play 씬으로 이동"
                  sequence: 3

