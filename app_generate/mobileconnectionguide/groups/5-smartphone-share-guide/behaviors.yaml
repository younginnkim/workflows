# Primary IR — luna-writer + widget-from-figma consume this.
# Group-merged: chapter 5 (스마트폰 공유 가이드) connected views.
group:
  key: "5"
  name: "스마트폰 공유 가이드"
  device_variant: "32\" StanbyME2"
  source:
    pdf: "mobileconnectionguide.pdf"
    version: "1.0.0"
    modified: "2025.08.12"
    change_note: "스마트폰 공유 가이드 내 TV 문구 StanbyME 로 변경"

# Placeholders used across every view of this group.
placeholders:
  - token: "%deviceType%"
    i18n_tag: "deviceType_*"
    meaning: "기기 종류 문구 (StanbyME). 문구태그로 치환"
  - token: "{name}"
    meaning: "전체 설정 메뉴에서 확인 가능한 StanbyME 이름"
  - token: "{%Mobile_name}"
    meaning: "가장 최근에 연결한 모바일 기기명"
  - token: "{%network name}"
    meaning: "현재 기기가 연결되어 있는 네트워크 이름"
  - token: "{%androidset_icon}"
    meaning: "안드로이드 폰의 설정 아이콘"
  - token: "{%iphoneset_icon}"
    meaning: "아이폰의 설정 아이콘"
  - token: "{%casting_icon}"
    meaning: "유튜브에서 캐스팅 하는 아이콘"
  - token: "{%airplay_icon}"
    meaning: "아이폰 AirPlay 아이콘"

views:
  # ==========================================================
  - screen:
      id: "5"
      name: "스마트폰 공유 가이드 (진입 화면)"
      source: { pages: [2] }
      entry:
        natural: "진입 방법 : 홈에서 모바일 연결하기 카드 선택"
        impl: { type: deep_link, from: "home.card.mobile_connection" }
      exit:
        natural: "종료 방법 : 리모컨 [Back] 버튼, 종료 아이콘"
        impl: { type: navigate_back }
      note:
        natural: "각 기능 진입 후 Back 동작은 공통 UX 정책에 따름"

    components:
      - ux_tag: "1"
        name: "타이틀 : 스마트폰 연결"
        figma_hint:
          text_contains: ["Enjoy Smartphone Content"]
          position: "top-center of dialog"
          visual_role: "title-text"
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "선택 불가 영역"
                  impl: { type: local_state, condition_expr: "always" }
                  confirmed_by_user: false
                display:
                  text:
                    i18n_key: "smartphone_share.guide.title"
                    i18n_key_source: auto_generated
                    fallback: "Enjoy Smartphone Content"
                  focusable: false

      - ux_tag: "2"
        name: "설명 문구"
        figma_hint:
          text_contains: ["Enjoy the screen or music from your smart phone"]
          position: "below title"
          visual_role: "body-text"
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "설명 문구"
                  impl: { type: local_state, condition_expr: "always" }
                display:
                  text:
                    i18n_key: "deviceType_01941"
                    i18n_key_source: from_pdf
                    fallback: "Enjoy the screen or music from your smart phone on %deviceType% with the wide screen and immersive volume."
                    placeholders: ["%deviceType%"]

      - ux_tag: "3"
        name: "기능 버튼 (Google Cast 활용, AirPlay 활용, Sound Share 활용 기능 모음)"
        figma_hint:
          text_contains: ["Stream content from Android device", "Stream content from iPhone", "Cast music from smartphone"]
          position: "horizontal card row, center of dialog"
          visual_role: "card-list-horizontal"
          child_count: 3
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "Google Cast 활용, AirPlay 활용, Sound Share 활용 기능 모음"
                  impl: { type: local_state, condition_expr: "always" }
                display:
                  list:
                    items:
                      - { i18n_key: "sn_home_0023", i18n_key_source: from_pdf, fallback: "Stream content from Android device" }
                      - { i18n_key: "sn_home_0024", i18n_key_source: from_pdf, fallback: "Stream content from iPhone" }
                      - { i18n_key: "deviceType_01942", i18n_key_source: from_pdf, fallback: "Cast music from smartphone to %deviceType% speaker" }

      - ux_tag: "exit_icon"
        name: "종료 아이콘"
        derived_from: "[추가 설명] 종료 방법 : 리모컨 [Back] 버튼, 종료 아이콘"
        figma_hint:
          position: "top-right of dialog"
          visual_role: "icon-button"
          has_icon: true
        behaviors:
          - trigger: on_select
            conditions:
              - when:
                  natural: "종료 방법 : 리모컨 [Back] 버튼, 종료 아이콘"
                  impl: { type: navigate_back }
                  confirmed_by_user: false

    unresolved:
      - id: "view5-vs-view5.1-relation"
        description: >
          page 2 (5. 스마트폰 공유 가이드) 와 page 3 (5. 스마트폰 공유 카드 > 메인 화면) 의
          목업이 동일. page 2 는 컴포넌트 구성(1/2/3 그룹) 명세, page 3 은 개별 카드 동작 명세로
          읽었으나, 서로 다른 화면인지 같은 화면의 2단 명세인지 PDF에 명시 없음.
        user_decision: needs_design_input

  # ==========================================================
  - screen:
      id: "5.1"
      name: "스마트폰 공유 카드 > 메인 화면"
      source: { pages: [3] }
      reached_from: { view: "5", trigger: "동일 화면의 카드별 상세 명세" }

    components:
      - ux_tag: "1"
        name: "Stream content from Android device (Google Cast)"
        figma_hint:
          text_contains: ["Stream content from Android device"]
          position: "first card of row"
          visual_role: "image-card-with-label"
          has_icon: true
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "기능 관련 버튼 이미지 제공"
                  impl: { type: local_state, condition_expr: "always" }
                display:
                  icon: google_cast_icon
                  text:
                    i18n_key: "sn_home_0023"
                    i18n_key_source: from_pdf
                    fallback: "Stream content from Android device"

          - trigger: on_select
            conditions:
              - when:
                  natural: "네트워크 미연결 시, 특정 카드(안드로이드폰 콘텐츠 TV에서 보기, 아이폰 화면 TV에서 보기) 선택하면 아래 팝업 호출"
                  impl:
                    type: luna_call
                    decision_ref: network-status
                    service: "com.webos.service.connectionmanager"
                    method: "getStatus"
                    condition_expr: "response.isInternetConnectionAvailable == false"
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                action:
                  natural: "네트워크 설정 필요 팝업 호출"
                  impl:
                    type: navigate_internal
                    target: "popup.network_required"

              - when:
                  natural: "특정 사유(e.g. 미지원 서비스 국가 등)에 의해 Google Cast, AirPlay 사용이 불가할 때"
                  impl:
                    type: unresolved
                    reason: "사용 가능 여부 판단 데이터 소스가 명세에 없음"
                  confirmed_by_user: false
                action:
                  natural: "선택 시 우측 토스트 팝업 제공"
                  impl:
                    type: navigate_internal
                    target: "toast.service_unavailable"
                    text:
                      i18n_key: "deviceType_01948"
                      i18n_key_source: from_pdf
                      fallback: "This service is not available in the country that your %deviceType% is set to."

              - when:
                  natural: "정상 상태 (네트워크 연결됨 + 서비스 사용 가능)"
                  impl: { type: local_state, condition_expr: "network.connected && service.available" }
                action:
                  natural: "선택 시, Google Cast 연결 가이드 화면 실행"
                  impl:
                    type: navigate_internal
                    target: "view.5.2-1"

      - ux_tag: "2"
        name: "Stream content from iPhone (AirPlay)"
        figma_hint:
          text_contains: ["Stream content from iPhone"]
          position: "second card of row"
          visual_role: "image-card-with-label"
          has_icon: true
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "기능 관련 버튼 이미지 제공"
                  impl: { type: local_state, condition_expr: "always" }
                display:
                  icon: airplay_icon
                  text:
                    i18n_key: "sn_home_0024"
                    i18n_key_source: from_pdf
                    fallback: "Stream content from iPhone"

          - trigger: on_select
            conditions:
              - when:
                  natural: "네트워크 미연결 시, 특정 카드(안드로이드폰 콘텐츠 TV에서 보기, 아이폰 화면 TV에서 보기) 선택하면 아래 팝업 호출"
                  impl:
                    type: luna_call
                    decision_ref: network-status
                    service: "com.webos.service.connectionmanager"
                    method: "getStatus"
                    condition_expr: "response.isInternetConnectionAvailable == false"
                  confirmed_by_user: true
                action:
                  natural: "네트워크 설정 필요 팝업 호출"
                  impl: { type: navigate_internal, target: "popup.network_required" }

              - when:
                  natural: "특정 사유(e.g. 미지원 서비스 국가 등)에 의해 Google Cast, AirPlay 사용이 불가할 때"
                  impl: { type: unresolved, reason: "사용 가능 여부 판단 데이터 소스가 명세에 없음" }
                action:
                  natural: "선택 시 우측 토스트 팝업 제공"
                  impl:
                    type: navigate_internal
                    target: "toast.service_unavailable"
                    text: { i18n_key: "deviceType_01948", fallback: "This service is not available in the country that your %deviceType% is set to." }

              - when:
                  natural: "정상 상태"
                  impl: { type: local_state, condition_expr: "network.connected && service.available" }
                action:
                  natural: "선택 시, AirPlay 연결 가이드 화면 실행"
                  impl: { type: navigate_internal, target: "view.5.3-1" }

      - ux_tag: "3"
        name: "Cast music from smartphone to %deviceType% speaker (Sound Share)"
        figma_hint:
          text_contains: ["Cast music from smartphone"]
          position: "third card of row"
          visual_role: "image-card-with-label"
          has_icon: true
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "기능 관련 이미지 제공"
                  impl: { type: local_state, condition_expr: "always" }
                display:
                  icon: sound_share_icon
                  text:
                    i18n_key: "deviceType_01942"
                    i18n_key_source: from_pdf
                    fallback: "Cast music from smartphone to %deviceType% speaker"

          - trigger: on_select
            conditions:
              - when:
                  natural: "연결된 기기 이력이 있는 경우"
                  impl:
                    type: luna_subscribe
                    decision_ref: bt-paired-devices
                    service: "com.webos.service.bluetooth2"
                    method: "device/getPairedDevices"
                    subscribe: true
                    condition_expr: "response.devices.length > 0"
                  confirmed_by_user: false
                action:
                  natural: "선택 시, 사운드 셰어 연결 화면으로 이동"
                  impl: { type: navigate_internal, target: "view.5.4" }

              - when:
                  natural: "연결된 기기 이력이 없는 경우"
                  impl:
                    type: luna_subscribe
                    decision_ref: bt-paired-devices
                    service: "com.webos.service.bluetooth2"
                    method: "device/getPairedDevices"
                    subscribe: true
                    condition_expr: "response.devices.length == 0"
                  confirmed_by_user: false
                action:
                  natural: "선택 시, 사운드 셰어 연결 화면으로 이동"
                  impl: { type: navigate_internal, target: "view.5.5" }
        note:
          natural: "사운드 셰어 연결 화면에서 Back 시, 스마트폰 공유 메인 화면으로 이동"
          note_on: "네트워크 미연결 팝업은 카드 1/2 에만 적용 — 카드 3(Sound Share)은 명세에서 제외됨"

      - ux_tag: "toast.service_unavailable"
        name: "서비스 미지원 국가 토스트"
        derived_from: "[추가 설명] 특정 사유(e.g. 미지원 서비스 국가 등)에 의해 Google Cast, AirPlay 사용이 불가할 때, 선택 시 우측 토스트 팝업 제공"
        visual_role: "toast"
        figma_hint:
          text_contains: ["This service is not available in the country"]
          position: "right side / bottom-right overlay"
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "특정 사유(e.g. 미지원 서비스 국가 등)에 의해 Google Cast, AirPlay 사용이 불가할 때"
                  impl:
                    type: unresolved
                    reason: "사용 가능 여부 판단 데이터 소스가 명세에 없음 — unresolved: service-availability-source"
                  confirmed_by_user: false
                display:
                  text:
                    i18n_key: "deviceType_01948"
                    i18n_key_source: from_pdf
                    fallback: "This service is not available in the country that your %deviceType% is set to."
                    placeholders: ["%deviceType%"]
                  triggered_by: ["ux_tag:1", "ux_tag:2"]
                  note: "카드 3(Sound Share)은 이 토스트 대상이 아님"

      - ux_tag: "popup.network_required"
        name: "네트워크 설정 필요 팝업"
        visual_role: "confirm-popup"
        figma_hint:
          text_contains: ["Network settings are required", "Yes", "No"]
          position: "modal overlay"
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "네트워크 미연결 시, 특정 카드 선택하면 아래 팝업 호출"
                  impl:
                    type: luna_call
                    decision_ref: network-status
                    condition_expr: "response.isInternetConnectionAvailable == false"
                display:
                  text:
                    i18n_key: "sn_home_0020"
                    i18n_key_source: from_pdf
                    fallback: "Network settings are required to enjoy this app. Do you want to go to 'Network Settings' for internet connection?"
                  buttons:
                    - { i18n_key: "sn_home_0083", i18n_key_source: from_pdf, fallback: "Yes" }
                    - { i18n_key: "sn_home_0083", i18n_key_source: from_pdf, fallback: "No" }

          - trigger: on_select
            conditions:
              - when:
                  natural: "Yes 선택 시, 네트워크 연결 화면으로 이동"
                  impl:
                    type: luna_call
                    decision_ref: launch-network-settings
                    service: "com.webos.service.applicationmanager"
                    method: "launch"
                    params:
                      id: "com.webos.app.settings"
                      params: { target: "network" }
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                action: { natural: "네트워크 연결 화면으로 이동" }

              - when:
                  natural: "No 선택 시, 팝업 닫힘"
                  impl: { type: local_state, action: "close_popup" }
                  confirmed_by_user: false
                action: { natural: "팝업 닫힘" }

    unresolved:
      - id: "service-availability-source"
        description: >
          "특정 사유(e.g. 미지원 서비스 국가 등)에 의해 Google Cast, AirPlay 사용이 불가할 때" —
          사용 가능 여부를 판단할 데이터 소스(국가 설정 키 / 서비스 상태 API)가 명세에 없음.
          토스트 문구(deviceType_01948)만 명시됨.
        user_decision: needs_design_input
      - id: "yes-no-i18n-tags"
        description: >
          팝업의 Yes/No 버튼에 대해 PDF에 sn_home_0020 / sn_home_0083 두 태그만 표기되어
          어느 태그가 버튼 라벨용인지 1:1 대응이 불명확.
        user_decision: needs_design_input

  # ==========================================================
  - screen:
      id: "5.2-1"
      name: "Google Cast > 가이드 화면(1)"
      source: { pages: [4] }
      reached_from: { view: "5.1", trigger: "on_select ux_tag:1 (Stream content from Android device)" }
      pattern:
        natural: "해당 화면 동작성은 Pattern, Component의 Wizardview에 따름"
        component: "WizardView"
      wizard: { step: 1, total: 3 }

    components:
      - ux_tag: "1"
        name: "단계 인디케이터"
        figma_hint: { position: "top-center", visual_role: "step-indicator", text_contains: ["1", "2", "3"] }
        behaviors:
          - trigger: render
            conditions:
              - when: { natural: "단계 인디케이터", impl: { type: local_state, condition_expr: "step == 1" } }
                display: { step_current: 1, step_total: 3 }

      - ux_tag: "2"
        name: "타이틀"
        figma_hint: { text_contains: ["Stream content from Android device"], position: "top-center below indicator", visual_role: "title-text" }
        behaviors:
          - trigger: render
            conditions:
              - when: { natural: "타이틀", impl: { type: local_state, condition_expr: "always" } }
                display:
                  text: { i18n_key: "sn_home_0023", i18n_key_source: from_pdf, fallback: "Stream content from Android device" }

      - ux_tag: "3"
        name: "설명 이미지"
        figma_hint: { position: "center, large rounded box", visual_role: "image" }
        behaviors:
          - trigger: render
            conditions:
              - when: { natural: "해당 단계 설명이 연상되는 이미지 제공", impl: { type: local_state, condition_expr: "always" } }
                display: { image: "guide_googlecast_step1", image_desc: "안드로이드폰 설정에서 W-Fi 메뉴로 이동한 이미지" }

      - ux_tag: "4"
        name: "설명 문구"
        figma_hint: { text_contains: ["Go to Settings", "Connections", "Wi-Fi"], position: "below image", visual_role: "body-text" }
        behaviors:
          - trigger: render
            conditions:
              - when: { natural: "해당 단계 설명 문구", impl: { type: local_state, condition_expr: "always" } }
                display:
                  text:
                    i18n_key: "sn_home_0026"
                    i18n_key_source: from_pdf
                    fallback: "Go to Settings {%androidset_icon} > Connections > Wi-Fi, then turn on Wi-Fi."
                    placeholders: ["{%androidset_icon}"]

      - ux_tag: "4-1"
        name: "설명 보조 문구 (네트워크 미연결 안내)"
        figma_hint: { text_contains: ["If the network is not connected on the phone"], position: "below 4", visual_role: "body-text-secondary" }
        behaviors:
          - trigger: render
            conditions:
              - when:
                  natural: "기기가 유선 네트워크로 연결된 상태일 때는 미제공함"
                  impl:
                    type: luna_call
                    decision_ref: network-status
                    service: "com.webos.service.connectionmanager"
                    method: "getStatus"
                    condition_expr: "response.wired.state == 'connected'"
                  confirmed_by_user: true
                  confirmed_at: "2026-08-10"
                display: { visible: false }

              - when:
                  natural: "유선 네트워크로 연결되지 않은 상태"
                  impl:
                    type: luna_call
                    decision_ref: network-status
                    condition_expr: "response.wired.state != 'connected'"
                  confirmed_by_user: true
                display:
                  visible: true
                  text:
                    i18n_key: "sn_home_0027"
                    i18n_key_source: from_pdf
                    fallback: "If the network is not connected on the phone, select your \"{%network name}\" to connect."
                    placeholders: ["{%network name}"]

      - ux_tag: "5"
        name: "Next 버튼"
        figma_hint: { text_contains: ["Next"], position: "bottom-center", visual_role: "button" }
        focusable: true
        default_focus: true
        behaviors:
          - trigger: render
            conditions:
              - when: { natural: "Default Focus", impl: { type: local_state, condition_expr: "always" } }
                display:
                  text: { i18n_key: "sn_home_0099", i18n_key_source: from_pdf, fallback: "Next" }
                  default_focus: true
          - trigger: on_select
            conditions:
              - when: { natural: "선택 시, 다음페이지 이동", impl: { type: navigate_internal, target: "view.5.2-2" } }
                action: { natural: "다음페이지 이동" }

      - ux_tag: "6"
        name: "[Previous] 버튼"
        figma_hint: { text_contains: ["Previous"], position: "top-left", visual_role: "button-with-chevron", has_icon: true }
        focusable: true
        behaviors:
          - trigger: on_select
            conditions:
