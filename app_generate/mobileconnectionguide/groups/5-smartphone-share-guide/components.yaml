# ux_tag → figma_hint mapping. widget-from-figma / widget-finder consume this.
# figma_hint is a HINT only — actual Figma node resolution is widget-from-figma's job.
group_key: "5"

# Repeating structures across views — implement once, reuse.
shared_patterns:
  - name: "WizardView"
    natural: "해당 화면 동작성은 Pattern, Component의 Wizardview에 따름"
    used_in: ["5.2-1", "5.2-2", "5.2-3", "5.3-1", "5.3-2", "5.3-3"]
    structure:
      - "step-indicator (top-center, completed steps → check icon)"
      - "title-text (top-center)"
      - "image (center, large rounded box)"
      - "body-text (below image, optional secondary line)"
      - "button row (bottom-center) — Next | Done | Google Cast"
      - "button-with-chevron 'Previous' (top-left)"
    visual_role: "wizard-page"

  - name: "GuideDialog"
    used_in: ["5", "5.1", "5.4", "5.5"]
    structure:
      - "title-text (top-center)"
      - "body-text (below title)"
      - "content area (cards | image)"
      - "button row (bottom-center) — optional"
    visual_role: "fullscreen-dialog"

views:
  - screen_id: "5"
    name: "스마트폰 공유 가이드 (진입 화면)"
    components:
      - ux_tag: "1"
        name: "타이틀 : 스마트폰 연결"
        visual_role: "title-text"
        figma_hint:
          text_contains: ["Enjoy Smartphone Content"]
          position: "top-center of dialog"
        states: []
        focusable: false

      - ux_tag: "2"
        name: "설명 문구"
        visual_role: "body-text"
        figma_hint:
          text_contains: ["Enjoy the screen or music from your smart phone", "immersive volume"]
          position: "below title, 2 lines centered"
        states: []
        focusable: false

      - ux_tag: "3"
        name: "기능 버튼 모음"
        visual_role: "card-list-horizontal"
        figma_hint:
          layer_name_contains: ["card", "button"]
          position: "center of dialog, 3 cards in a row"
          child_count: 3
          has_icon: true
        states: []
        focusable: true
        focus_order: 1
        children:
          - { visual_role: "image-card-with-label", text_contains: ["Stream content from Android device"], has_icon: "google_cast" }
          - { visual_role: "image-card-with-label", text_contains: ["Stream content from iPhone"], has_icon: "airplay" }
          - { visual_role: "image-card-with-label", text_contains: ["Cast music from smartphone"], has_icon: "tv_phone_wireless" }

      - ux_tag: "exit_icon"
        name: "종료 아이콘"
        visual_role: "icon-button"
        figma_hint:
          layer_name_contains: ["close", "exit", "x"]
          position: "top-right of dialog"
          has_icon: true
        states: []
        focusable: true
        focus_order: 2

  - screen_id: "5.1"
    name: "스마트폰 공유 카드 > 메인 화면"
    note: "5와 동일 목업. 카드별 개별 동작 명세."
    components:
      - ux_tag: "1"
        name: "Stream content from Android device (Google Cast)"
        visual_role: "image-card-with-label"
        figma_hint:
          text_contains: ["Stream content from Android device"]
          position: "first card of 3-card row"
          has_icon: true
          icon_hint: "Google Cast logo"
        states: ["normal", "network_disconnected", "service_unavailable"]
        focusable: true
        focus_order: 1

      - ux_tag: "2"
        name: "Stream content from iPhone (AirPlay)"
        visual_role: "image-card-with-label"
        figma_hint:
          text_contains: ["Stream content from iPhone"]
          position: "second card of 3-card row"
          has_icon: true
          icon_hint: "AirPlay logo"
        states: ["normal", "network_disconnected", "service_unavailable"]
        focusable: true
        focus_order: 2

      - ux_tag: "3"
        name: "Cast music from smartphone to %deviceType% speaker (Sound Share)"
        visual_role: "image-card-with-label"
        figma_hint:
          text_contains: ["Cast music from smartphone", "speaker"]
          position: "third card of 3-card row"
          has_icon: true
          icon_hint: "TV + phone with wireless waves"
        states: ["has_paired_device", "no_paired_device"]
        focusable: true
        focus_order: 3

      - ux_tag: "toast.service_unavailable"
        name: "서비스 미지원 국가 토스트"
        visual_role: "toast"
        figma_hint:
          text_contains: ["This service is not available in the country"]
          position: "right side / bottom-right overlay"
        states: []
        focusable: false

      - ux_tag: "popup.network_required"
        name: "네트워크 설정 필요 팝업"
        visual_role: "confirm-popup"
        figma_hint:
          text_contains: ["Network settings are required to enjoy this app", "Yes", "No"]
          position: "modal overlay, center"
          child_count: 2
        states: []
        focusable: true
        children:
          - { visual_role: "button", text_contains: ["Yes"], focus_order: 1 }
          - { visual_role: "button", text_contains: ["No"], focus_order: 2 }

