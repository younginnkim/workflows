# ─── generated_code 규칙 (luna-writer 가 채움) ────────────────────────────────
# 각 decision 의 generated_code 블록은 그대로 잘라 붙일 수 있는 코드다.
#   service_code : lib/data/service/*_service.dart 의 메서드 (클래스 본문에 삽입)
#   entity_code  : lib/domain/entity/*.dart 의 모델 (있는 경우만)
#   wiring       : 해당 화면 view_model 에서 호출하는 코드
# 같은 파일을 공유하는 decision 이 여러 개면(예: bluetooth2) import/필드 선언은
# generated_code_meta.file_headers 에 한 번만 정의하고, 메서드만 각 decision 에 둔다.
generated_code_meta:
  project: mobile_connection_guide
  language: flutter-dart
  architecture: mvvm            # data/service · domain/entity · presentation/page
  bridge_import: "package:webos_service_bridge/webos_service_bridge.dart"
  bridge_dependency: "pubspec.yaml:114 webos_service_bridge (git: flutter-webos-plugins)"
  patterns_source: luna-writer-skill (callOneReply / call().listen())
  rules:
    - "단일 호출: WebOSServiceBridge.callOneReply(request)"
    - "구독: WebOSServiceBridge.call(request).listen(...) + dispose() 에서 cancel()"
    - "응답은 반드시 returnValue 확인, 실패 시 errorText 로그"
    - "acg 값이 있으면 appinfo.json > requiredPermissions 주석으로 명시"
    - "{UNRESOLVED:*} / 문서 미확인 값은 절대 추측하지 않고 TODO + 런타임 예외로 남김"

  # 파일별 공통 헤더 — 각 서비스 파일 최상단에 1회만 작성한다.
