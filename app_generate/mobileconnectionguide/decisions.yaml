    also_covers:
      - "기기가 유선 네트워크로 연결된 상태일 때는 미제공함"
      - "TV가 유선 네트워크로 연결된 상태일 때는 미제공함"
    search_query: "connectionmanager getStatus wifi wired state"
    search_command: "grep -nE '^## ' luna-api-docs/API_Docs/com.webos.service.connectionmanager_v3.0.md"
    doc_source: "API_Docs/com.webos.service.connectionmanager_v3.0.md:488"
    chosen:
      service: "com.webos.service.connectionmanager"
      method: "getStatus"
      subscribe: true
      acg: "networkconnection.query"
      params_template:
        subscribe: true
      return_fields:
        - isInternetConnectionAvailable
        - "wifi.state"
        - "wired.state"
        - "wired.interfaceName"
      condition_expr_offline: "response.isInternetConnectionAvailable == false"
      condition_expr_wired: "response.wired.state == 'connected'"
    rationale: >
      단일 API로 (1) 인터넷 연결 여부 (팝업 호출 조건) 와
      (2) 유선 연결 여부 (4-1 보조 문구 미제공 조건) 를 모두 판단 가능.
    confirmed_by_user: true
    confirmed_at: "2026-08-10"
    used_in_screens: ["5.1", "5.2-1", "5.3-1"]
    generated_code:
      target_file: lib/data/service/connectionmanager_service.dart
      target_class: ConnectionmanagerService
      entity_file: lib/domain/entity/connectionmanager.dart
      service_code: |
        // ACG required: networkconnection.query (declare in appinfo.json > requiredPermissions)
        /// luna://com.webos.service.connectionmanager/getStatus (subscribe)
        /// doc: API_Docs/com.webos.service.connectionmanager_v3.0.md:488
        ///
        /// 네트워크 상태 변화를 계속 통지한다.
        /// - 팝업 호출 조건 : status.isOffline
        /// - 유선 연결 조건 : status.isWiredConnected (보조 문구 미제공)
        void startStatusSubscribe({
          required void Function(Connectionmanager status) onStatus,
        }) {
          final request = WebOSServiceData(
            'luna://com.webos.service.connectionmanager/getStatus',
            payload: {'subscribe': true},
          );

          _statusSubscription = WebOSServiceBridge.call(request).listen((event) {
            if (event['returnValue'] == true) {
              onStatus(Connectionmanager.fromMap(event));
            } else {
              print('getStatus error: ${event['errorText']}');
            }
          });
        }

        void stopStatusSubscribe() {
          _statusSubscription?.cancel();
          _statusSubscription = null;
        }
      entity_code: |
        // Connectionmanager — Entity for com.webos.service.connectionmanager
        /// getStatus 응답 매핑. return_fields 만 담는다.
        class Connectionmanager {
          const Connectionmanager({
            required this.isInternetConnectionAvailable,
            this.wifiState,
            this.wiredState,
            this.wiredInterfaceName,
          });

          final bool isInternetConnectionAvailable;
          final String? wifiState;
          final String? wiredState;
          final String? wiredInterfaceName;

          /// condition_expr_offline: response.isInternetConnectionAvailable == false
          bool get isOffline => !isInternetConnectionAvailable;

          /// condition_expr_wired: response.wired.state == 'connected'
          bool get isWiredConnected => wiredState == 'connected';

          factory Connectionmanager.fromMap(Map<String, dynamic> map) {
            final wifi = map['wifi'] as Map<String, dynamic>?;
            final wired = map['wired'] as Map<String, dynamic>?;
            return Connectionmanager(
              isInternetConnectionAvailable:
                  map['isInternetConnectionAvailable'] as bool? ?? false,
              wifiState: wifi?['state'] as String?,
              wiredState: wired?['state'] as String?,
              wiredInterfaceName: wired?['interfaceName'] as String?,
            );
          }
        }
      wiring:
        - screen: "5.1"
          file: lib/presentation/page/smartphone_share_guide/main_view_model.dart
          target_class: MainViewModel
          code: |
            final _connectionmanager = ConnectionmanagerService();
            final _applicationmanager = ApplicationmanagerService();

            Connectionmanager? networkStatus;

            /// 진입 시 1회 구독 시작 — 이후 상태 변화가 그대로 반영된다.
            void init() {
              _connectionmanager.startStatusSubscribe(onStatus: (status) {
                networkStatus = status;
                notifyListeners();
              });
            }

            /// 카드(안드로이드폰 콘텐츠 / 아이폰 화면) 선택 시 호출.
            /// 미연결이면 네트워크 설정 필요 팝업, 연결이면 가이드로 진행.
            void onShareCardSelected(VoidCallback openGuide) {
              if (networkStatus?.isOffline ?? true) {
                showNetworkRequiredPopup = true;
                notifyListeners();
                return;
              }
              openGuide();
            }

            /// 유선 연결 상태에서는 4-1 보조 문구를 제공하지 않는다.
            bool get showWirelessHintText =>
                !(networkStatus?.isWiredConnected ?? false);

            @override
            void dispose() {
              _connectionmanager.stopStatusSubscribe();
              super.dispose();
            }
        - screen: "5.2-1"
