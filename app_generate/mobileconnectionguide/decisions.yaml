      service_code: |
        /// TODO(unresolved: soundout-value-mapping)
        ///   '블루투스 기기' / '블루투스 + 기기 스피커' 에 1:1 대응하는 soundOutput
        ///   값 이름이 문서에 없다. 아래는 후보값이며 Settings_Sound 시나리오로
        ///   확인 후 확정할 것. 임의 추가/추측 금지.
        static const List<String> bluetoothSoundOutputCandidates = [
          'bt_soundbar',
          'lgSoundSync',
          'tv_external_speaker',
        ];

        // ACG required: audio.query (declare in appinfo.json > requiredPermissions)
        /// luna://com.webos.service.audio/getSoundOutput
        /// doc: API_Docs/com.webos.service.audio_v1.14.md:3822
        Future<String?> getSoundOutput() async {
          final request = WebOSServiceData(
            'luna://com.webos.service.audio/getSoundOutput',
            payload: const {},
          );

          final response = await WebOSServiceBridge.callOneReply(request);

          if (response != null && response['returnValue'] == true) {
            return response['soundOutput'] as String?;
          }
          print('getSoundOutput failed: ${response?['errorText']}');
          return null;
        }

        /// condition_expr 대응 — 현재 출력이 블루투스 계열인지.
        Future<bool> isBluetoothSoundOutput() async {
          final current = await getSoundOutput();
          return current != null &&
              bluetoothSoundOutputCandidates.contains(current);
        }
      wiring:
        - screen: "5.4"
          file: lib/presentation/page/smartphone_share_guide/sound_share_paired_view_model.dart
          target_class: SoundSharePairedViewModel
          code: |
            /// 연결 직후: 사운드 아웃이 블루투스 계열이면 '기기 스피커' 로 되돌린다.
            Future<void> ensureTvSpeakerOutput() async {
              if (await _audio.isBluetoothSoundOutput()) {
                await _audio.setSoundOutputToTvSpeaker();
              }
            }

