        /// 'tv_speaker' = 기기 스피커 (문서의 TV 적용 값 목록에서 확인).
        Future<bool> setSoundOutputToTvSpeaker() async {
          final request = WebOSServiceData(
            'luna://com.webos.service.audio/setSoundOutput',
            payload: const {'soundOutput': 'tv_speaker'},
          );

          final response = await WebOSServiceBridge.callOneReply(request);

          if (response != null && response['returnValue'] == true) {
            return true;
          }
          print('setSoundOutput failed: ${response?['errorText']}');
          return false;
        }
