      // AudioService — LS2 service binding for com.webos.service.audio
      import 'package:webos_service_bridge/webos_service_bridge.dart';

      class AudioService {
        // ↓ decision: soundout-get / soundout-set 의 service_code 를 여기에 삽입
      }
    lib/data/service/applicationmanager_service.dart: |
      // ApplicationmanagerService — LS2 service binding for com.webos.service.applicationmanager
      import 'package:webos_service_bridge/webos_service_bridge.dart';

      class ApplicationmanagerService {
        // ACG required: application.operation (declare in appinfo.json > requiredPermissions)
        /// luna://com.webos.service.applicationmanager/launch — 공통 실행 헬퍼.
        /// doc: API_Docs/com.webos.service.applicationmanager_v4.9.md:5406
        Future<bool> launch({
          required String id,
          Map<String, dynamic>? params,
        }) async {
          final request = WebOSServiceData(
            'luna://com.webos.service.applicationmanager/launch',
            payload: {
              'id': id,
              if (params != null) 'params': params,
            },
          );

          final response = await WebOSServiceBridge.callOneReply(request);

          if (response != null && response['returnValue'] == true) {
            return true;
          }
          print('launch($id) failed: ${response?['errorText']}');
          return false;
        }

        // ↓ decision: soundshare-stream-out / launch-network-settings /
        //   launch-google-cast 의 service_code 를 여기에 삽입
      }

